server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Support für Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-Control für statische Assets (Vite Fingerprinting nutzt das aus)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}