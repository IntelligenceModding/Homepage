version: '3'

services:
  volume_ownership:
    image: alpine:3.24.1
    volumes:
      - surrealdb_data:/data
    command: chown -R 65532 /data

  surrealdb:
    image: surrealdb/surrealdb:v3.1.5
    entrypoint:
      - /surreal
      - start
      - --username
      - intelligence
      - --password
      - intelligence
      - surrealkv:/data/intelligence.db
    ports:
      - 8000:8000
    volumes:
      - surrealdb_data:/data
    depends_on:
      volume_ownership:
        condition: service_completed_successfully

volumes:
  surrealdb_data: {}
